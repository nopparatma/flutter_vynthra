name: vynthra
description: "A new Flutter project."

publish_to: 'none'

version: 1.1.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  expandable: ^5.0.1
  flutter_expandable_fab: ^2.5.2
  get: ^4.7.2
  flutter_sticky_header: ^0.11.0
  loading_animation_widget: ^1.3.0
  flutter_widget_from_html_core: ^0.17.4
  flutter_launcher_icons: ^0.14.3
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/vynthra_logo_with_bg.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cloud
      fonts:
        - asset: assets/fonts/cloud/Cloud-Light.otf
        - asset: assets/fonts/cloud/Cloud-Bold.otf
          weight: 700