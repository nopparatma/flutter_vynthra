name: Build and distribute with Fastlane

on:
  push:
    branches:
      - main      # build ด้วย config/prod.json
      - 'rc/**'   # build ด้วย config/dev.json

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Create Firebase Service Credentials file
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 -d > firebase_credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase_credentials.json" >> $GITHUB_ENV

      - name: Extract Version Number
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "FLUTTER_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Current version: ${VERSION}"

      - name: Select environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "APP_ENV=prod" >> $GITHUB_ENV
          else
            echo "APP_ENV=dev" >> $GITHUB_ENV
          fi

      - name: Distribute Android app with Fastlane
        run: |
          cd android
          bundle exec fastlane distribute_firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          APP_ENV: ${{ env.APP_ENV }}
          BUILD_NUMBER: ${{ github.run_number }}  # เพิ่มขึ้นทุกครั้งที่ workflow รัน

      # ถ้าต้องการ build สำหรับ iOS เพิ่มขั้นตอนต่อไปนี้
