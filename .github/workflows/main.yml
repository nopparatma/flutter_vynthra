name: Build and distribute

on:
  push:
    branches:
      - main      # build ด้วย config/prod.json
      - 'rc/**'   # build ด้วย config/dev.json

# android กับ web รันขนานกัน ไม่รอกัน ตัวไหนเสร็จก่อนก็ปล่อยก่อน
env:
  FLUTTER_VERSION_PIN: '3.50.0'
  APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
  BUILD_NUMBER: ${{ github.run_number }}  # เพิ่มขึ้นทุกครั้งที่ workflow รัน

permissions:
  contents: read

jobs:
  # บน main: กันการปล่อย prod ด้วยเลขเวอร์ชันซ้ำกับรอบก่อน (tag v<version> มีอยู่แล้วที่ commit อื่น)
  preflight:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Check release tag is unused
        if: github.ref_name == 'main'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # annotated tag มีสองบรรทัด บรรทัดท้าย (^{}) คือ commit ที่ tag ชี้
          EXISTING=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}" | tail -1 | cut -f1)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${TAG} already exists on another commit. Bump version in pubspec.yaml before releasing."
            exit 1
          fi
          echo "Tag ${TAG} is free or already on this commit"

  android:
    name: Android (Firebase App Distribution)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_PIN }}
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Create Firebase Service Credentials file
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 -d > firebase_credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase_credentials.json" >> $GITHUB_ENV

      - name: Extract Version Number
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "FLUTTER_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Current version: ${VERSION}"

      - name: Distribute Android app with Fastlane
        run: |
          cd android
          bundle exec fastlane distribute_firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}

  web:
    name: Web (Vercel)
    needs: preflight
    runs-on: ubuntu-latest
    concurrency:
      group: web-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.ref_name == 'main' && vars.VERCEL_PROJECT_ID_PROD || vars.VERCEL_PROJECT_ID_DEV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Deploying web to ${{ github.ref_name == 'main' && 'vynthra-web (prod)' || 'vynthra-web-dev' }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_PIN }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --dart-define-from-file=config/${APP_ENV}.json --build-number=${BUILD_NUMBER}

      # แต่ละ project ให้บริการจาก production deployment ของตัวเอง
      # จึง deploy ด้วย --prod ทั้งคู่ ตัวเลือก dev/prod อยู่ที่ project id
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.16.0 deploy build/web --prod --yes --token="$VERCEL_TOKEN"

  # บน main: ติด tag v<version> ให้เองเมื่อทั้ง android และ web ผ่าน
  tag:
    name: Tag release
    needs: [preflight, android, web]
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          TAG: v${{ needs.preflight.outputs.version }}
        run: |
          if [ -n "$(git ls-remote origin "refs/tags/${TAG}")" ]; then
            echo "Tag ${TAG} already exists on this commit, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG#v}"
          git push origin "${TAG}"
