name: Build and distribute

on:
  push:
    branches:
      - main      # build ด้วย config/prod.json
      - 'rc/**'   # build ด้วย config/dev.json

# android กับ web รันขนานกัน ไม่รอกัน ตัวไหนเสร็จก่อนก็ปล่อยก่อน
env:
  FLUTTER_VERSION_PIN: '3.50.0'
  APP_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

# รันทีละรอบต่อ branch เพื่อไม่ให้สองรอบได้เลขเวอร์ชันเดียวกัน
concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # เลขเวอร์ชันมาจาก git tag (ดู .github/scripts/resolve-version.mjs)
  #   rc/**: patch และ build number +1 ทุกรอบ
  #   main:  ไม่บวก ใช้เลขของ commit ที่ผ่าน rc มาแล้ว
  preflight:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      is_new: ${{ steps.resolve.outputs.is_new }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # ให้เห็น parent ของ merge commit บน main

      - name: Resolve version
        id: resolve
        run: |
          export BASE_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          node .github/scripts/resolve-version.mjs

  android:
    name: Android (Firebase App Distribution)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_PIN }}
          channel: 'stable'
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Create Firebase Service Credentials file
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" | base64 -d > firebase_credentials.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase_credentials.json" >> $GITHUB_ENV

      - name: Distribute Android app with Fastlane
        run: |
          cd android
          bundle exec fastlane distribute_firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FLUTTER_VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build }}

  web:
    name: Web (Vercel)
    needs: preflight
    runs-on: ubuntu-latest
    concurrency:
      group: web-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ github.ref_name == 'main' && vars.VERCEL_PROJECT_ID_PROD || vars.VERCEL_PROJECT_ID_DEV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "Deploying web to ${{ github.ref_name == 'main' && 'vynthra-web (prod)' || 'vynthra-web-dev' }}"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_PIN }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
        run: flutter build web --release --dart-define-from-file=config/${APP_ENV}.json --build-name=${VERSION} --build-number=${BUILD_NUMBER}

      # แต่ละ project ให้บริการจาก production deployment ของตัวเอง
      # จึง deploy ด้วย --prod ทั้งคู่ ตัวเลือก dev/prod อยู่ที่ project id
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@65.16.0 deploy build/web --prod --yes --token="$VERCEL_TOKEN"

  # rc/**: จดเลขของรอบนี้เป็น tag เมื่อทั้ง android และ web ผ่าน (main ไม่ติด tag ใหม่)
  tag:
    name: Tag build
    needs: [preflight, android, web]
    if: needs.preflight.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and push tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION} build ${BUILD_NUMBER}"
          git push origin "v${VERSION}"
