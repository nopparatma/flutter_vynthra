<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <!-- edge to edge: Flutter (3.50+) then reports the notch and home bar through SafeArea -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05060A">
  <!-- iOS 26 Safari ignores theme-color: it tints its status bar and toolbar from solid position:fixed
       elements touching the top and bottom edges, else from html/body. Flutter draws into an absolutely
       placed view, so two thin fixed strips give Safari a colour to read; the Flutter view covers them. -->
  <style>
    html, body { background-color: #05060A; }
    .vy-edge { position: fixed; left: 0; right: 0; height: 12px; background-color: #05060A; pointer-events: none; }
    .vy-edge.top { top: 0; }
    .vy-edge.bottom { bottom: 0; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="flutter_vynthra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_vynthra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="vy-edge top" aria-hidden="true"></div>
  <div class="vy-edge bottom" aria-hidden="true"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
